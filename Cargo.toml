[workspace]
resolver = "3"
members = ["crates/pgcore", "crates/zedtheme", "crates/pgbrowser"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
# `tree-sitter` is required for the real syntax-highlight theme (without it gpui-component compiles a
# stub that ignores Zed's `editor.*` keys) and `tree-sitter-sql` powers the SQL console.
gpui-kit = { version = "0.6.4", features = ["tree-sitter", "tree-sitter-sql"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-postgres = "0.7.18"

# GPUI is slow unoptimised; keep UI dependencies fast in dev builds.
[profile.dev.package."*"]
opt-level = 2
